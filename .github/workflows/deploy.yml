name: Build data pipeline & deploy site

# Runs the RuckMetrics pipeline to generate the dataset, builds the self-contained
# static engine, and publishes it to GitHub Pages. Static hosting only — the tRPC
# API / DuckDB are not served here; the page reads the pipeline-generated data
# baked in at build time.

on:
  push:
    branches:
      - claude/ruckmetrics-bivariate-engine-dcceid
      - main
  workflow_dispatch:

# Least-privilege token scoped for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (all packages)
        run: npm run typecheck

      - name: Test (all packages)
        run: npm test

      # ---- pipeline: generate the data ----
      - name: Seed the store (full deterministic cohort)
        run: npm run seed

      - name: Run ETL (real adapters, best-effort)
        # Live rugbypy/RugbyPass/match-centre feeds are generally unreachable from
        # GitHub runners, so the adapters fall back to their recorded fixtures and
        # layer any fetched rows on top of the seed. Never fail the deploy on this.
        run: npm run etl
        continue-on-error: true

      - name: Build static site (inline pipeline data)
        run: npm run build:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
